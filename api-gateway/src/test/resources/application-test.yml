server:
  port: 0

spring:
  application:
    name: api-gateway-test
  cloud:
    gateway:
      routes:
        - id: auth-service-login
          uri: http://localhost:4005
          predicates:
            - Path=/login

        - id: auth-service-validate
          uri: http://localhost:4005
          predicates:
            - Path=/validate

        - id: auth-service-register
          uri: http://localhost:4005
          predicates:
            - Path=/register

        - id: auth-service-forgot-password
          uri: http://localhost:4005
          predicates:
            - Path=/forgot-password

        - id: auth-service-reset-password
          uri: http://localhost:4005
          predicates:
            - Path=/reset-password

        - id: insurance-service-clients
          uri: http://localhost:4000
          predicates:
            - Path=/api/clients/**
          filters:
            - StripPrefix=1
            - name: JwtValidation

        - id: insurance-service-cars
          uri: http://localhost:4000
          predicates:
            - Path=/api/cars/**
          filters:
            - StripPrefix=1
            - name: JwtValidation

        - id: insurance-service-drivers
          uri: http://localhost:4000
          predicates:
            - Path=/api/drivers/**
          filters:
            - StripPrefix=1
            - name: JwtValidation

        - id: insurance-service-policies
          uri: http://localhost:4000
          predicates:
            - Path=/api/policies/**
          filters:
            - StripPrefix=1
            - name: JwtValidation

        - id: insurance-service-policy-download
          uri: http://localhost:4000
          predicates:
            - Path=/api/policies/*/download
          filters:
            - StripPrefix=1
            - name: JwtValidation

        - id: insurance-service-public
          uri: http://localhost:4000
          predicates:
            - Path=/public/**

        - id: insurance-service-chat
          uri: http://localhost:4000
          predicates:
            - Path=/api/chat/**
          filters:
            - StripPrefix=1
            - name: JwtValidation

        - id: insurance-service-chat-ws
          uri: http://localhost:4000
          predicates:
            - Path=/ws-chat/**
          filters:
            - StripPrefix=0

        - id: insurance-service-api-docs
          uri: http://localhost:4000
          predicates:
            - Path=/insurance-api-docs
          filters:
            - RewritePath=/insurance-api-docs, /v3/api-docs

        - id: auth-service-api-docs
          uri: http://localhost:4005
          predicates:
            - Path=/auth-api-docs
          filters:
            - RewritePath=/auth-api-docs, /v3/api-docs

  web:
    cors:
      allowed-origins: "*"
      allowed-methods: "*"
      allowed-headers: "*"
      allow-credentials: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.ain.apigateway: DEBUG
    org.springframework.web.reactive: DEBUG