<!DOCTYPE html>
<html>
<head>
  <title>Reset Password - Insurance System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-container">
  <div class="auth-card">
    <h2>Set New Password</h2>
    <div id="errorMsg" class="error-msg"></div>
    <div id="successMsg" class="success-msg"></div>

    <div class="input-group">
      <label>Reset Token</label>
      <input type="text" id="token" placeholder="Enter the token from email">
    </div>

    <div class="input-group">
      <label>New Password</label>
      <input type="password" id="newPassword" placeholder="At least 6 characters">
    </div>

    <div class="input-group">
      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Confirm new password">
    </div>

    <button onclick="doResetPassword()" class="btn-primary">Reset Password</button>

    <div class="auth-link">
      <a href="login.html">Back to Login</a>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  async function doResetPassword() {
    const token = document.getElementById('token').value;
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const errorDiv = document.getElementById('errorMsg');
    const successDiv = document.getElementById('successMsg');

    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';

    if (!token || !newPassword) {
      errorDiv.style.display = 'block';
      errorDiv.textContent = 'Please fill all fields';
      return;
    }

    if (newPassword !== confirmPassword) {
      errorDiv.style.display = 'block';
      errorDiv.textContent = 'Passwords do not match';
      return;
    }

    if (newPassword.length < 6) {
      errorDiv.style.display = 'block';
      errorDiv.textContent = 'Password must be at least 6 characters';
      return;
    }

    const success = await resetPassword(token, newPassword);

    if (success) {
      successDiv.style.display = 'block';
      successDiv.textContent = 'Password reset successful! Redirecting to login...';
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 2000);
    } else {
      errorDiv.style.display = 'block';
      errorDiv.textContent = 'Invalid or expired token. Please try again.';
    }
  }
</script>
</body>
</html>
