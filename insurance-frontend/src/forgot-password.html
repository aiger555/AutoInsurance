<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password - Insurance System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <h2>Reset Password</h2>
        <p style="margin-bottom: 20px;">Enter your email and we'll send you a reset token</p>
        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>

        <div class="input-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>

        <button onclick="doForgotPassword()" class="btn-primary">Send Reset Token</button>

        <div class="auth-link">
            <a href="login.html">Back to Login</a>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    async function doForgotPassword() {
        const email = document.getElementById('email').value;
        const errorDiv = document.getElementById('errorMsg');
        const successDiv = document.getElementById('successMsg');

        errorDiv.style.display = 'none';
        successDiv.style.display = 'none';

        if (!email) {
            errorDiv.style.display = 'block';
            errorDiv.textContent = 'Please enter your email';
            return;
        }

        const success = await forgotPassword(email);

        successDiv.style.display = 'block';
        successDiv.textContent = 'If your email exists, you will receive a reset token soon.';

        document.getElementById('email').value = '';
    }
</script>
</body>
</html>
